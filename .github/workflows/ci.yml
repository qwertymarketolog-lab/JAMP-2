name: JAMP 2 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jamp2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff / Mypy / Pytest (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jamp2
          POSTGRES_PASSWORD: jamp2
          POSTGRES_DB: jamp2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jamp2 -d jamp2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://jamp2:jamp2@localhost:5432/jamp2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/jamp2
      - name: Pytest (unit and real PostgreSQL integration)
        run: python -m pytest -q
