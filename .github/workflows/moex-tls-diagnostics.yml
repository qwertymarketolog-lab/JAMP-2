name: MOEX TLS Diagnostics

on:
  workflow_dispatch:
    inputs:
      confirm_tls:
        description: 'Type "yes" to authorize a TLS-only diagnostic handshake'
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    name: Require explicit TLS diagnostic authorization
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless confirm_tls is yes
        env:
          CONFIRM_TLS: ${{ inputs.confirm_tls }}
        run: |
          if [ "$CONFIRM_TLS" != "yes" ]; then
            echo "::error::TLS diagnostics require confirm_tls=yes"
            exit 1
          fi

  tls-diagnostics:
    name: MOEX TLS chain and Python trust store
    needs: guard
    if: inputs.confirm_tls == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare diagnostic output directory
        run: mkdir -p tests/e2e/artifacts
      - name: Capture verified TLS peer chain and Python trust store
        run: >-
          python scripts/moex_tls_diagnostics.py
          --host iss.moex.com
          --output tests/e2e/artifacts/moex-tls-diagnostics.json
      - name: Upload TLS diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-tls-diagnostics-${{ github.run_id }}
          path: tests/e2e/artifacts/moex-tls-diagnostics.json
          if-no-files-found: error
