services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jamp2
      POSTGRES_PASSWORD: jamp2
      POSTGRES_DB: jamp2
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamp2 -d jamp2"]
      interval: 5s
      timeout: 5s
      retries: 10
